spring:
  application:
    name: socials-svc

  # Loads a local, gitignored `.env` file — same mechanism as every other Aura service.
  config:
    import: "optional:file:.env[.properties]"

  # Same Supabase Postgres project as the other services, own schema (`social`) — always through
  # the Supavisor pooler (port 6543, transaction mode), never the direct connection.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      pool-name: socials-svc-pool

  flyway:
    default-schema: social
    schemas: social
    locations: classpath:db/migration

  # Supabase Auth signs access tokens with the project's asymmetric key (ES256) and publishes it
  # as a JWKS — verification needs no shared secret.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL:https://feokdvpaexpvwpzpueot.supabase.co}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
          audiences: authenticated

server:
  port: ${PORT:8087}

aura:
  social:
    max-friends: 5000
    # Unanswered requests one user may have out at once — stops request spam.
    max-pending-outgoing: 200
    max-search-results: 20

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Plain, readable console logging for local dev (IntelliJ, ./gradlew bootRun). Structured JSON logs
# live in application-prod.yml — activate with SPRING_PROFILES_ACTIVE=prod (Render deployment).
